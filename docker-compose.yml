services:
    app:
        image: ghcr.io/bababodinabile/mushaf:latest
        container_name: mushaf_app_container
        build: .
        restart: unless-stopped
        ports:
            - '8090:80'
        env_file: .env
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - mushaf_storage:/var/www/html/storage
        healthcheck:
            test: ['CMD', 'curl', '-fs', 'http://127.0.0.1/up']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 20s

volumes:
    mushaf_storage:
